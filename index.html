<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu tabs</title>
</head>
<style>
  [v-cloak]{
    display:none;
  } 
  /*样式重置*/
  *{
    margin:0;
    padding: 0;
  }
  ul,ol,li{
    list-style: none;
  }
  /*一级盒子样式*/
  .first-menu-box ul{
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 60px;
    border-bottom: 1px solid #ccc;
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  }
  .first-menu-box li.curClass {
    color: #e60021;
    font-weight:bold;
  }
  .first-menu-box li {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .first-menu-box li a{
    cursor: pointer;
    position: relative;
  }
  .first-menu-box li a:hover{
    color: #e60021;
    font-weight:bold;
  }
  .first-menu-box li a::before{
    content: '';
    position: absolute;
    width: 100%;
    height: 2px;
    bottom: -10px;
    left: 0;
    background-color: #e60021;
    visibility: hidden;
    -webkit-transform: scaleX(0);
    transform: scaleX(0);
    -webkit-transition: all 0.3s ease-in-out 0s;
    transition: all 0.3s ease-in-out 0s;
  }
  .first-menu-box li a:hover::before{
    visibility: visible;
  -webkit-transform: scaleX(1);
  transform: scaleX(1);
  }
  /*二级盒子样式*/
  .second-menu-box{
    background: #fff;
    margin-top: 10px;
  }
  .second-menu-box ul {
    width:90%;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .second-menu-box ul li {
    flex: 1 0 16.66667%; /* 100 / 6 = 16.66667% */
    max-width: 16.66667%;
    margin: 10px 0;
    cursor: pointer;
  }
  .second-menu-box ul li img{
    width: 100%;
    height: 100%;
    -webkit-transition: -webkit-transform .3s linear;
    transition: -webkit-transform .3s linear;
    transition: transform .3s linear;
    transition: transform .3s linear,-webkit-transform .3s linear;
  }
  .second-menu-box ul li img:hover{
    -webkit-transform: scale(1.1);
    transform: scale(1.1)
  }
  .second-menu-box ul li:hover .carName{
    color: #e60021;
  }
  /*文本超出*/
  .txt-ellipsis {
    white-space: nowrap;  /* 不换行 */
    overflow: hidden;    /* 隐藏超出的内容 */
    text-overflow: ellipsis; /* 超出部分显示为省略号 */
    width: 100%; /* 设置宽度 */
  }
  .txtc{
    text-align: center;
  }
  /*mobile*/

  /* example 5 */
  .menu {
	position: relative;
	display:  inline-block;
	width: 30px;
	height: 30px;
	margin: 10px;
}
.menu span {
	margin: 0 auto;
	position: relative;
	top: 12px;
}
.menu span:before, .menu span:after {
	position: absolute;
	content: '';
}
.menu span, .menu span:before, .menu span:after {
	width: 30px;
	/* height: 6px; */
  height: 3px;
	background-color: #7f7f7f;
	display: block;
}
.menu span:before {
	margin-top: -10px;
}
.menu span:after {
	margin-top: 10px;
}
.example5 span {
	-webkit-transition-duration: 0s; transition-duration: 0s;
	-webkit-transition-delay: 0.2s; transition-delay: 0.2s;
}
.example5:hover span {
	background-color: rgba(0,0,0,0.0);
	-webkit-transition-delay: 0.2s; transition-delay: 0.2s;
}
.example5 span:before {
	-webkit-transition-property: margin, -webkit-transform; transition-property: margin, transform;
	-webkit-transition-duration: 0.2s; transition-duration: 0.2s;
	-webkit-transition-delay: 0.2s, 0s; transition-delay: 0.2s, 0s;
}

.example5 span:after {
	-webkit-transition-property: margin, -webkit-transform; transition-property: margin, transform;
	-webkit-transition-duration: 0.2s; transition-duration: 0.2s;
	-webkit-transition-delay: 0.2s, 0s; transition-delay: 0.2s, 0s;
}
.example5:hover span:after {
	margin-top: 0;
	-webkit-transform: rotate(-45deg); transform: rotate(-45deg);
	-webkit-transition-delay: 0s, 0.2s; transition-delay: 0s, 0.2s;
}
.example5:hover span:before {
	margin-top: 0;
	-webkit-transform: rotate(45deg); transform: rotate(45deg);
	-webkit-transition-delay: 0s, 0.2s; transition-delay: 0s, 0.2s;
}
  .navName{
    text-align: left;
    color: red;
    font-weight: bold;
    height: 59px;
    line-height: 59px;
    width: calc(100% - 48px);
    margin: 0 auto;
    box-sizing: border-box;
    position: relative;
    cursor: pointer;
    border-bottom: 1px solid #f1eded;
  }
  .navName svg{
    position: absolute;
    top:40%;
    right: 10px;
  }
  .eachBrandWrap{
    width: 100%;
    height: 100px;
    overflow-x: scroll;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none; 
    margin-bottom: 15px;
  }
  .eachBrandWrap::-webkit-scrollbar {
  display: none;  /* Chrome, Safari, Opera */
}
  .eachMCar{
    width: 80px;
    height: 100px;
    float: left;
    margin-left: 10px;
  }
  .isimg{
    width: 80px;
    height: 80px;
  }
  .isimg img{
    height: 100%;
    width: 100%;
  }
.menus{
  margin-top: 20px;
}
  .headerIcon{
    height: 30px;
    width: 100%;
    padding-top: 10px;
    padding-right: 10px;
    box-sizing: border-box;
    transition: all 1s linear;
  }
    .rotated {
      transition: transform 0.3s ease;
      transform: rotate(180deg);
    }

  /* mobile（通常视口宽度小于 768px） */
@media (max-width: 767px) {
  .forPC{
    display: none;
  }
  .forMobile{
    display: block;
  }
}

/* PC（通常视口宽度大于或等于 768px） */
@media (min-width: 768px) {
  .forPC{
    display: block;
  }
  .forMobile{
    display: none;
  }
}

.bounce-top {
	-webkit-animation: bounce-top 0.9s both;

}

</style>
<body>
  
    <div id="app" v-cloak>
      <!--PC-->
        <div class="forPC">
        <div class="first-menu-box">
            <ul>
                <li 
                :class="{'curClass': curfirstMenuId === index + 1}" 
                @click="handleClickFirstMenu(item.id)" 
                v-for="(item, index) in firstMenuData" 
                :key="index"
                @mouseenter="handleMouseEnter(item.id)" 
                >
                  <a>{{item.title}}</a>
                </li>
            </ul>
        </div>
        <div class="second-menu-box">
            <ul @mouseleave="handleMouseLeave">
              <li 
              v-for="(item, index) in secondMenuDataPoor[`m${curfirstMenuId}`]" 
              :key="index"
              >
                <div><image :src="item.img" /></div>
                <div class="carName txt-ellipsis txtc">{{item.title}}</div>
              </li>
            </ul>
        </div>
      </div>

        <!--mobile-->
        <div class="forMobile">
          <div class="headerIcon">
            <div id="menu-icon" class="icon" style="float: right;">
              <a href="#" class="menu example5"><span></span></a>
            </div>
          </div>
          <div class="menus" v-show="ifshow" :class="{'bounce-top': ifshow}">
            <ul>
              <li v-for="(item, index) in firstMenuData" 
              :key="index"
              @click="handleMobileClick(index, $event, item.title)"
              >
                <div class="navName mySvg">{{item.title}}
                  <svg class="mySvgIcons" xmlns="http://www.w3.org/2000/svg" width="17" height="16" viewBox="0 0 17 16" fill="none">
                    <path d="M13.9449 5.74359L8.61161 11.0769L3.27828 5.7436" stroke="black" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </div>
                <div class="eachBrandWrap" v-show="curMobileIdx === index">
                  <ul class="eachBrandBox" :style="{'width': computedW(index+1)}">
                    <li class="eachMCar" v-for="(item, idx) in secondMenuDataPoor[`m${index+1}`]" 
                    :key="idx">
                      <div class="isimg"><img :src="item.img" /></div>
                      <p class="txt-ellipsis txtc">{{item.title}}</p>
                    </li>
                  </ul>
                </div>
                  
              </li>
            </ul>
          </div>
        </div>
    </div>
    
    
</body>
</html>
<script src="https://cdn.staticfile.org/vue/3.0.5/vue.global.js"></script>

      let curfirstMenuId = ref('')
      const handleClickFirstMenu = (id) => {
        curfirstMenuId.value = id
      }
      const handleMouseEnter = (id) => {
        handleClickFirstMenu(id)
      }
      const handleMouseLeave = () => {
        curfirstMenuId.value = ''
      }
      const handleClickOutside = () => {
        console.log('handleClickOutside')
      }
      // 移动端icons事件绑定
      const handleMobileClick = (idx, e, title) => {
        cahePoor.value[title] = ++initCount
        const _this = e.target
        const odList = document.querySelectorAll('.mySvgIcons')
        odList.forEach((i) => {
          i.classList.remove('rotated');
        })
        if (cahePoor.value[title] % 2 === 0) { 
          curMobileIdx.value = ''
          
        } else {
          curMobileIdx.value = idx
          _this.querySelector('.mySvgIcons').classList.add('rotated');
        }
        
        
        
      }
      onMounted(() => {
        console.log('This will run right before mounting');
        let _count = 0;
        document.getElementById('menu-icon')
          .addEventListener('click', function() {
            ++_count
            console.log(_count, '_count')
            ifshow.value = _count % 2 === 0 ? false : true
          });
        
      });
      return {
        firstMenuData,
        secondMenuDataPoor,
        curfirstMenuId,
        curMobileIdx,
        ifshow,
        computedW,
        handleClickFirstMenu,
        handleMouseEnter,
        handleMouseLeave,
        handleClickOutside,
        handleMobileClick
      };
    }
  }
  Vue.createApp(App).mount('#app');
